name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.REGISTRY_LOGIN_SERVER }}/power-bi-optimizer:${{ github.sha }}
            ${{ secrets.REGISTRY_LOGIN_SERVER }}/power-bi-optimizer:latest

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: power-bi-optimizer
          resourceGroup: rg-pbi-optimizer
          imageToDeploy: ${{ secrets.REGISTRY_LOGIN_SERVER }}/power-bi-optimizer:${{ github.sha }}
          targetPort: 8000
          ingress: external
          environmentVariables: >
            PBI_TENANT_ID=secretref:pbi-tenant-id
            PBI_CLIENT_ID=secretref:pbi-client-id
            PBI_CLIENT_SECRET=secretref:pbi-client-secret
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          # Secrets passed as Container Apps secrets (set via azure-setup.sh or portal)
          # PBI_TENANT_ID, PBI_CLIENT_ID, PBI_CLIENT_SECRET are stored in the Container App
