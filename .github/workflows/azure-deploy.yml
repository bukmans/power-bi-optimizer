name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  pull_request:          # tests only – deploy is skipped for PRs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # matches the Dockerfile
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    needs: test
    # Only main deploys; the Azure identity only trusts tokens for main anyway
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write      # OIDC sign-in to Azure, no stored password
    # Created by deploy/azure-setup.sh, which prints the values for these variables.
    # The Container App already holds its secrets, mount and scale settings; this job
    # only swaps the image.
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP || 'rg-pbi-optimizer' }}
      APP_NAME: ${{ vars.APP_NAME || 'power-bi-optimizer' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check configuration
        run: |
          if [ -z "$ACR_NAME" ]; then
            echo "::error::Repository variable ACR_NAME is not set. Run deploy/azure-setup.sh and add the variables it prints."
            exit 1
          fi

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        run: |
          az acr login --name "$ACR_NAME"
          IMAGE="$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)/power-bi-optimizer"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
          echo "IMAGE=$IMAGE:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Deploy new image
        run: |
          az containerapp update --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" -o none

      - name: Check the new revision is up
        run: |
          # The old revision keeps serving until the new one is ready, so wait for the
          # new revision itself rather than just any answer from /healthz
          for i in $(seq 1 30); do
            read -r LATEST READY FQDN < <(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --query "[properties.latestRevisionName, properties.latestReadyRevisionName, properties.configuration.ingress.fqdn]" -o tsv | tr '\n' ' ')
            if [ "$LATEST" = "$READY" ] && curl -fsS "https://$FQDN/healthz" >/dev/null; then
              echo "Healthy: $LATEST at https://$FQDN"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Revision $LATEST did not become ready within 5 minutes. Check the Container App's log stream (az containerapp logs show)."
          exit 1
